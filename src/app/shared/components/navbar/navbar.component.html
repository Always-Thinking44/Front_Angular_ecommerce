<nav class="navbar">
  <div class="navbar-inner">
    <a routerLink="/" class="marca">
      <span class="marca-icono">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
          <path d="M3 6h18"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
      </span>
      <span class="marca-nome">Minha<em>Loja</em></span>
    </a>

    <div class="links">
      <a routerLink="/loja" routerLinkActive="ativo">Produtos</a>

      @if (auth.autenticado()) {
        <a routerLink="/conta/historico" routerLinkActive="ativo">Encomendas</a>

        @if (auth.isAdmin()) {
          <div class="dropdown">
            <span class="dropdown-trigger">Admin
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="m6 9 6 6 6-6"/>
              </svg>
            </span>
            <div class="dropdown-menu">
              <a routerLink="/admin/produtos" routerLinkActive="ativo">Produtos</a>
              <a routerLink="/admin/categorias" routerLinkActive="ativo">Categorias</a>
              <a routerLink="/admin/encomendas" routerLinkActive="ativo">Encomendas</a>
            </div>
          </div>
        }

        <a routerLink="/carrinho" routerLinkActive="ativo" class="carrinho-link">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"/>
            <circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          Carrinho
          @if (carrinhoStore.numeroItens() > 0) {
            <span class="badge">{{ carrinhoStore.numeroItens() }}</span>
          }
        </a>

        <button class="btn-sair" (click)="terminarSessao()">Sair</button>
      } @else {
        <a routerLink="/auth/registo" routerLinkActive="ativo" class="btn-registar">Criar conta</a>
        <a routerLink="/auth/login" routerLinkActive="ativo" class="btn-entrar">Entrar</a>
      }
    </div>
  </div>
</nav>
